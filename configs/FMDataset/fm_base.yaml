project_name: "LoopSplat_SLAM_fm"
dataset_name: "fm_dataset"
checkpoint_path: null
use_wandb: false
frame_limit: -1
seed: 0

mapping:
  new_submap_every: 50
  map_every: 1
  iterations: 100
  new_submap_iterations: 100
  new_submap_points_num: 100000
  new_submap_gradient_points_num: 50000
  new_frame_sample_size: 30000
  new_points_radius: 0.0001
  current_view_opt_iterations: 0.4
  alpha_thre: 0.6
  pruning_thre: 0.5
  submap_using_motion_heuristic: true

tracking:
  gt_camera: false
  w_color_loss: 0.6
  iterations: 200
  cam_rot_lr: 0.002
  cam_trans_lr: 0.01
  odometry_type: "odometer"       # FM has no GT — use odometer for init
  help_camera_initialization: true
  init_err_ratio: 3
  odometer_method: "hybrid"
  filter_alpha: false
  filter_outlier_depth: false
  alpha_thre: 0.98
  soft_alpha: true
  mask_invalid_depth: true
  enable_exposure: false

  # IMU loss (FM dataset has IMU — enable for IMU ablation)
  use_imu: false
  lambda_imu_trans: 0.01
  lambda_imu_rot: 0.01
  imu:
    T_cam_imu:
      - [0.999834482, -0.014281001, 0.011232117, -0.093735308]
      - [0.014512037, 0.999679666, -0.020760474, -0.004530765]
      - [-0.010931932, 0.020920576, 0.999721705, -0.000971498]
      - [0.0, 0.0, 0.0, 1.0]
    accel_bias: [0.0, 0.0, 0.0]
    gyro_bias: [0.0, 0.0, 0.0]
    accel_bias_variance: 4.0e-7
    accel_noise_variance: 5.88e-4
    gyro_bias_variance: 2.5e-9
    gyro_noise_variance: 1.22e-6
    gravity_mps2: 9.81
    gravity_max_accel_std: 0.2
    gravity_max_gyro_norm: 0.1
    translation_huber_m: 0.1
    rotation_huber_rad: 0.1
    time_offset_s: 0.0

cam:
  H: 480
  W: 640
  fx: 608.446
  fy: 607.847
  cx: 331.332
  cy: 245.549
  depth_scale: 1000.0            # 0.001m per unit → /1000 = meters
  use_filtered_depth: false      # set true to use filtered/ depth
  register_depth_to_color: true
  depth_intrinsics:
    - [583.980, 0.0, 325.103]
    - [0.0, 583.980, 240.718]
    - [0.0, 0.0, 1.0]
  T_color_depth:
    - [0.999980211, -0.00069964811, -0.0062491186, -0.057460]
    - [0.000735448557, 0.999983311, 0.00572841847, -0.001073]
    - [0.00624500681, -0.00573290139, 0.999964058, -0.002205]
    - [0.0, 0.0, 0.0, 1.0]

keyframing:
  enable_gi_slam: false
  w_covis: 1.0
  w_base: 1.0
  w_mot: 2.0
  score_threshold: 0.5
  v_max: 0.8
  omega_max: 50.0
  min_keyframe_interval: 1
  max_keyframe_gap: 30
  use_imu_gyro: false
  fps: 30.0

gaussian_pyramid:
  enabled: false
  num_sub_levels: 2
  uses_per_level: 8

lc:
  min_similarity: 0.5
  pgo_edge_prune_thres: 0.25
  voxel_size: 0.02
  pgo_max_iterations: 500
  registration:
    method: "gs_reg"
    base_lr: 0.005
    min_overlap_ratio: 0.2
    use_render: false
    gsr_max_iters: 60            # reduced from 100 for computational feasibility
  min_interval: 3
  final: false
